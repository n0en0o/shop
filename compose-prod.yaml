# docker compose -p marketplace-prod -f compose-prod.yaml down -v
# docker-compose -p marketplace-prod -f compose-prod.yaml up -d
# docker-compose -p marketplace-prod -f compose-prod.yaml up --build -d

services:
  catalog-db-prod:
    container_name: "catalog-db-prod"
    image: postgres:18.1
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_DB=catalog-db-prod
    restart: always
    ports:
      - "9301:5432"
    volumes:
      - postgres-catalog-prod:/var/lib/postgresql
    networks:
      - marketplace-prod-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  catalog-api:
    container_name: catalog-api
    build:
      context: .
      dockerfile: cmd/catalog/DockerFile
    ports:
      - "9201:7001"
    networks:
      - marketplace-prod-net
    environment:
      - CATALOG_APP_PORT=7001
      - CATALOG_PG_HOST=catalog-db-prod
      - CATALOG_PG_PORT=5432
      - CATALOG_PG_DATABASE=catalog-db-prod
      - CATALOG_PG_USER=postgres
      - CATALOG_PG_PASSWORD=12345678
      - CATALOG_PG_SSLMODE=disable
      - CATALOG_MIGRATION_PATH=file:///app/migrations/catalog
    depends_on:
      catalog-db-prod:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  basket-db-prod:
    container_name: basket-db-prod
    image: postgres:15.3-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: basket-db-prod
    ports:
      - "9302:5432"
    volumes:
      - postgres-basket-prod:/var/lib/postgresql/data
    networks:
      - marketplace-prod-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  basket-api:
    container_name: basket-api
    build:
      context: .
      dockerfile: cmd/basket/DockerFile
    ports:
      - "9202:7002"
    networks:
      - marketplace-prod-net
    environment:
      - BASKET_APP_PORT=7002
      - BASKET_DATABASE_URL=postgres://postgres:123456789@basket-db-prod:5432/basket-db-prod?sslmode=disable
      - BASKET_MIGRATIONS_PATH=file://migrations/basket
      - BASKET_REDIS_URL=basket-cache-redis-prod:6379
      - BASKET_REDIS_PASSWORD=123456789
    depends_on:
      basket-db-prod:
        condition: service_healthy
      basket-cache-redis-prod:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7002/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  basket-cache-redis-prod:
    container_name: basket-redis-prod
    image: redis:7
    command: redis-server --requirepass "123456789" --protected-mode no
    restart: always
    ports:
      - "9312:6379"
    volumes:
      - redis-basket-prod:/data 
    networks:
      - marketplace-prod-net

volumes:
  postgres-catalog-prod:
  postgres-basket-prod:
  redis-basket-prod:

networks:
  marketplace-prod-net:
    driver: bridge
