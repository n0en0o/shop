# docker compose -p shop-prod -f compose-prod.yaml down -v
# docker-compose -p shop-prod -f compose-prod.yaml up -d
# docker-compose -p shop-prod -f compose-prod.yaml up --build -d

services:
  catalog-db-prod:
    container_name: "catalog-db-prod"
    image: postgres:18.1
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456789
      - POSTGRES_DB=catalog-db-prod
    restart: always
    ports:
      - "9301:5432"
    volumes:
      - postgres-catalog-prod:/var/lib/postgresql
    networks:
      - shop-prod-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  catalog-api:
    container_name: catalog-api
    build:
      context: .
      dockerfile: cmd/catalog/DockerFile
    ports:
      - "9201:7001"
    networks:
      - shop-prod-net
    environment:
      - CATALOG_APP_PORT=7001
      - CATALOG_METRICS_PORT=7011
      - CATALOG_PG_HOST=catalog-db-prod
      - CATALOG_PG_PORT=5432
      - CATALOG_PG_DATABASE=catalog-db-prod
      - CATALOG_PG_USER=postgres
      - CATALOG_PG_PASSWORD=123456789
      - CATALOG_PG_SSLMODE=disable
      - CATALOG_MIGRATION_PATH=file:///app/migrations/catalog
    depends_on:
      catalog-db-prod:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  basket-db-prod:
    container_name: basket-db-prod
    image: postgres:15.3-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: basket-db-prod
    ports:
      - "9302:5432"
    volumes:
      - postgres-basket-prod:/var/lib/postgresql/data
    networks:
      - shop-prod-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Promotion services (MySQL + gRPC)
  promotion_db_prod:
    container_name: promotion-db-prod
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 123456789
      MYSQL_DATABASE: promotion-db
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    restart: always
    ports:
      - "9303:3306"
    volumes:
      - mysql_promotion_prod:/var/lib/mysql
    networks:
      - shop-prod-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456789"]
      interval: 10s
      timeout: 10s
      retries: 10

  promotion-grpc:
    container_name: promotion-grpc
    build:
      context: .
      dockerfile: cmd/promotion/DockerFile
    ports:
      - "9203:7003"
      - "9213:7013"
    networks:
      - shop-prod-net
    environment:
      - PROMOTION_DATABASE_URL=root:123456789@tcp(promotion_db_prod:3306)/promotion-db?parseTime=true&multiStatements=true
      - PROMOTION_MIGRATIONS_PATH=file:///app/migrations/promotion
      - PROMOTION_GRPC_PORT=7003
      - PROMOTION_METRICS_PORT=7013
    depends_on:
      promotion_db_prod:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 7003 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
  
  basket-api:
    container_name: basket-api
    build:
      context: .
      dockerfile: cmd/basket/DockerFile
    ports:
      - "9202:7002"
    networks:
      - shop-prod-net
    environment:
      - BASKET_APP_PORT=7002
      - BASKET_DATABASE_URL=postgres://postgres:123456789@basket-db-prod:5432/basket-db-prod?sslmode=disable
      - BASKET_MIGRATIONS_PATH=file://migrations/basket
      - BASKET_REDIS_URL=basket-cache-redis-prod:6379
      - BASKET_REDIS_PASSWORD=123456789
      # gRPC Promotion service
      - BASKET_PROMOTION_HOST=promotion-grpc
      - BASKET_PROMOTION_PORT=7003
      # RabbitMQ
      - BASKET_RABBITMQ_HOST=rabbit_mq_prod
      - BASKET_RABBITMQ_PORT=5672
      - BASKET_RABBITMQ_USER=guest
      - BASKET_RABBITMQ_PASSWORD=guest
    depends_on:
      basket-db-prod:
        condition: service_healthy
      basket-cache-redis-prod:
        condition: service_healthy
      promotion-grpc:
        condition: service_healthy
      rabbit_mq_prod:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7002/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  basket-cache-redis-prod:
    container_name: basket-redis-prod
    image: redis:7
    command: redis-server --requirepass "123456789" --protected-mode no
    restart: always
    ports:
      - "9312:6379"
    volumes:
      - redis-basket-prod:/data 
    networks:
      - shop-prod-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456789", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # RabbitMQ
  rabbit_mq_prod:
    container_name: rabbit-mq-prod
    hostname: marketplace-mq
    image: rabbitmq:3-management
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: always
    ports:
      - "9322:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_data_prod:/var/lib/rabbitmq
    networks:
      - shop-prod-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # Checkout services (PostgreSQL + API)
  checkout_db_prod:
    container_name: checkout-db-prod
    image: postgres:18.1
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456789
      - POSTGRES_DB=checkout-db-prod
    restart: always
    ports:
      - "9304:5432"
    volumes:
      - postgres_checkout_prod:/var/lib/postgresql
    networks:
      - shop-prod-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  checkout_api:
    container_name: checkout-api
    build:
      context: .
      dockerfile: cmd/checkout/Dockerfile
    ports:
      - "9204:7004"
    networks:
      - shop-prod-net
    environment:
      - CHECKOUT_APP_PORT=7004
      - CHECKOUT_DATABASE_URL=postgres://postgres:123456789@checkout_db_prod:5432/checkout-db-prod?sslmode=disable
      - CHECKOUT_MIGRATIONS_PATH=file:///app/migrations/checkout
      # RabbitMQ
      - CHECKOUT_RABBITMQ_HOST=rabbit_mq_prod
      - CHECKOUT_RABBITMQ_PORT=5672
      - CHECKOUT_RABBITMQ_USER=guest
      - CHECKOUT_RABBITMQ_PASSWORD=guest
    depends_on:
      checkout_db_prod:
        condition: service_healthy
      rabbit_mq_prod:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7004/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 40s

  # Infrastructure: monitoring and management
  prometheus:
    container_name: prometheus-prod
    image: prom/prometheus:v3.10.0
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - shop-prod-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Grafana: metrics visualization
  grafana:
    container_name: grafana-prod
    image: grafana/grafana:12.3.4
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - shop-prod-net
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # k6: load testing
  k6:
    container_name: k6-load-test
    image: grafana/k6:latest
    volumes:
      - ./infrastructure/k6:/scripts:ro
    environment:
      - TARGET_URL=http://catalog-api:7001
    networks:
      - shop-prod-net
    depends_on:
      catalog-api:
        condition: service_healthy
    command: ["run", "/scripts/catalog-test.js"]
    restart: "no"

volumes:
  postgres-catalog-prod:
  postgres-basket-prod:
  redis-basket-prod:
  mysql_promotion_prod:
  rabbitmq_data_prod:
  postgres_checkout_prod:
  prometheus_data:
  grafana_data:

networks:
  shop-prod-net:
    driver: bridge
